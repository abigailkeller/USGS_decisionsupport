# The app: one copy of the container built by GitHub Actions.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: egc-decision-support
  labels:
    app: egc-decision-support
spec:
  # Exactly one copy: every visitor shares one data/ folder, and the server
  # keeps track of running model fits in memory. Recreate (rather than a
  # rolling update) stops the old copy before starting the new one, since the
  # storage can only be attached to one copy at a time.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: egc-decision-support
  template:
    metadata:
      labels:
        app: egc-decision-support
    spec:
      containers:
        - name: app
          # the tag is set in kustomization.yaml
          image: ghcr.io/abigailkeller/usgs_decisionsupport
          imagePullPolicy: IfNotPresent
          # The storage is mounted over data/, which hides the folders the
          # Dockerfile creates there, so make sure they exist first.
          command: ["sh", "-c", "mkdir -p data/staging data/model_data data/posterior_samples && exec node server.js"]
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PORT
              value: "8000"
            # Chatbot (see chat/chat.js), using the open-weights models hosted
            # by the National Research Platform. The key comes from the
            # egc-decision-support-chat secret:
            #   kubectl create secret generic egc-decision-support-chat \
            #     --from-literal=nrp-llm-api-key="$(cat ~/.nrp_llm_key)"
            # Without the secret the rest of the app works and the chat
            # button doesn't appear.
            - name: CHAT_PROVIDER
              value: openai
            - name: CHAT_BASE_URL
              value: https://ellm.nrp-nautilus.io/v1
            # tried in order: if one is down or busy, the next answers
            - name: CHAT_MODEL
              value: gemma,gpt-oss,qwen3-small
            # a fresh private cache key per question, so NRP doesn't share
            # cached prompts with its other users
            - name: CHAT_CACHE_SALT
              value: "1"
            # shown in the chat panel and the page footer
            - name: CHAT_PRIVACY_NOTE
              value: Your questions and results are answered by AI models hosted on the National Research Platform (NRP).
            - name: CHAT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: egc-decision-support-chat
                  key: nrp-llm-api-key
                  optional: true
          # A model fit runs 4 MCMC chains in parallel (one core each).
          # Memory peaks while the 4 chains compile the model's C++ code at
          # the same time: about 9.6 GB for 3 years of data. Going over the
          # limit kills the container (OOMKilled) and the run is lost.
          resources:
            requests:
              cpu: "4"
              memory: 16Gi
            limits:
              cpu: "4"
              memory: 16Gi
          # Model fits run as separate R processes, so the web server keeps
          # answering these checks while they run.
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: egc-decision-support-data
